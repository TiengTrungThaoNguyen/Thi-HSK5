  body.examMode::before{
    background-image:linear-gradient(135deg,var(--rose-bg1),var(--rose-bg2));
  }
  .wrap{max-width:820px; margin:0 auto; padding:20px 14px 60px;}
  .brand{text-align:center; margin-bottom:18px;}
  .brand .logo{font-size:26px; font-weight:800; color:var(--rose-primary-dark);}
  .brand .sub{font-size:13px; color:var(--rose-accent); margin-top:2px;}
  .pageFooter{text-align:center; margin-top:22px; padding-top:16px; border-top:1px solid var(--rose-light);}
  .pageFooter .pfName{font-size:16px; font-weight:800; color:var(--rose-primary-dark);}
  .pageFooter .pfSub{font-size:13px; color:#475569; margin-top:4px;}
  .pageFooter .pfPhone{font-size:13px; color:#475569; margin-top:2px;}
  .card{
    background:#fff; border-radius:18px; padding:22px;
    box-shadow:0 8px 24px rgba(136,19,55,0.12);
    border:1px solid var(--rose-light);
    margin-bottom:16px;
  }
  h2.cardTitle{margin:0 0 14px; color:var(--rose-primary-dark); font-size:19px;}
  label{display:block; font-size:13px; font-weight:600; margin:12px 0 6px; color:var(--rose-text);}
  input[type=text], select, textarea{
    width:100%; padding:11px 13px; border-radius:10px;
    border:1.5px solid var(--rose-light); font-size:15px; background:var(--rose-lighter);
    color:var(--rose-text); font-family:inherit;
  }
  textarea{resize:vertical; min-height:70px;}
  input:focus, select:focus, textarea:focus{outline:none; border-color:var(--rose-primary);}
  .btn{
    display:inline-block; padding:12px 26px; border-radius:999px; border:none;
    background:linear-gradient(135deg,var(--rose-primary),var(--rose-accent));
    color:#fff; font-weight:700; font-size:15px; cursor:pointer;
    box-shadow:0 6px 16px rgba(136,19,55,0.3);
  }
  .btn:disabled{opacity:0.5; cursor:not-allowed;}
  .btn.secondary{background:#fff; color:var(--rose-primary-dark); border:2px solid var(--rose-primary); box-shadow:none;}
  .btnRow{text-align:center; margin-top:18px;}
  .errMsg{color:var(--red); font-size:13px; margin-top:8px; font-weight:600;}
  #examScreen{display:none;}
  #resultOverlay{display:none; position:fixed; inset:0; background:rgba(136,19,55,0.55); z-index:50; overflow-y:auto;}
  #resultOverlay .card{max-width:760px; margin:30px auto;}
  .examHead{
    position:sticky; top:0; z-index:10; background:#fff; border-radius:18px;
    padding:14px 18px; margin-bottom:16px; box-shadow:0 6px 16px rgba(136,19,55,0.15);
    display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:10px;
    border:1px solid var(--rose-light);
  }
  .examHead .who{font-size:13px; line-height:1.5;}
  .examHead .who b{color:var(--rose-primary-dark);}
  .timer{font-size:20px; font-weight:800; color:var(--rose-primary-dark); background:var(--rose-lighter); padding:6px 14px; border-radius:12px;}
  .sectionTitle{
    font-size:20px; font-weight:800; color:#fff; background:linear-gradient(135deg,var(--rose-primary),var(--rose-accent));
    padding:10px 18px; border-radius:14px; margin:26px 0 14px;
  }
  .partHead{margin-bottom:12px;}
  .partHead .name{font-weight:700; color:var(--rose-primary-dark); font-size:16px;}
  .partLabel{display:inline-block; background:var(--rose-primary); color:#fff; font-weight:700; font-size:12px; padding:3px 12px; border-radius:999px; margin-bottom:8px;}
  .partHead .zh{font-weight:800; color:var(--rose-primary-dark); font-size:16px; line-height:1.4;}
  .partHead .desc{font-size:13px; color:#9f1239; margin-top:3px;}
  .groupHead{font-weight:800; color:var(--rose-primary-dark); font-size:14px; margin:16px 0 8px; padding-top:14px; border-top:1px dashed var(--rose-light);}
  .groupHead:first-of-type{border-top:none; padding-top:0; margin-top:0;}
  .qBlock{border-top:1px dashed var(--rose-light); padding-top:14px; margin-top:14px;}
  .qBlock:first-child{border-top:none; padding-top:0; margin-top:0;}
  .qRow{display:flex; align-items:center; gap:10px; margin:10px 0; flex-wrap:wrap;}
  .qNum{font-weight:800; color:var(--rose-primary-dark); min-width:26px;}
  .qText{flex:1 1 100%; font-size:15px; margin-bottom:4px;}
  .bubbles{display:flex; gap:8px; flex-wrap:wrap;}
  .bubble{
    padding:9px 16px; border-radius:999px; border:2px solid var(--rose-light);
    background:#fff; cursor:pointer; font-weight:600; font-size:14px; color:#1e293b;
    transition:all .15s;
  }
  .bubble:hover{border-color:var(--rose-accent);}
  .bubble.selected{background:var(--rose-primary); border-color:var(--rose-primary); color:#fff;}
  .bubble.correct{background:#fff; border-color:var(--green); color:var(--green); font-weight:800;}
  .bubble.wrong{background:#fff; border-color:var(--red); color:var(--red); font-weight:800;}
  .imgPool{display:flex; gap:14px; flex-wrap:wrap; margin-bottom:14px;}
  .imgPoolItem img{display:block; width:100%; max-width:340px; height:auto; border-radius:10px; border:2px solid var(--rose-light);}
  .textPool{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; background:var(--rose-lighter); padding:12px; border-radius:12px;}
  .textPoolItem{background:#fff; border:1.5px solid var(--rose-light); border-radius:10px; padding:6px 12px; font-size:14px;}
  .textPoolItem b{color:var(--rose-primary-dark);}
  .passagePool{display:flex; flex-direction:column; gap:10px; margin-bottom:14px;}
  .passagePoolItem{background:var(--rose-lighter); border:1.5px solid var(--rose-light); border-radius:10px; padding:10px 14px; font-size:14px; line-height:1.7;}
  .passagePoolItem b{color:var(--rose-primary-dark); margin-right:6px;}
  .passageBox{background:var(--rose-lighter); border-left:4px solid var(--rose-primary); padding:12px 14px; border-radius:10px; margin-bottom:10px; font-size:15px; line-height:1.6;}
  .blankMark{display:inline-block; min-width:34px; border-bottom:2px solid var(--rose-primary-dark); color:var(--rose-primary-dark); font-weight:800; text-align:center;}
  .vietP2Item{margin-bottom:18px;}
  .goiYChip{display:inline-block; background:var(--rose-primary); color:#fff; font-weight:700; padding:4px 12px; border-radius:999px; margin-bottom:8px; font-size:14px;}
  .audioBar{
    display:flex; align-items:center; gap:10px; background:var(--rose-lighter);
    border:1.5px solid var(--rose-light); border-radius:14px; padding:10px 14px; margin-bottom:12px; cursor:pointer;
  }
  .audioBar .label{font-weight:700; font-size:14px; flex:1;}
  .audioBar .sub{font-size:11px; color:#9f1239;}
  .audioBar .btn{padding:8px 16px; font-size:13px; box-shadow:none;}
  .audioBar.collapsed .audioTrack, .audioBar.collapsed .btn.replayBtn{display:none;}
  .audioTrack{display:none;}
  .tbdNote{font-size:12px; color:#9f1239; font-style:italic; margin-top:6px;}
  .progressWrap{background:var(--rose-lighter); border-radius:999px; height:8px; overflow:hidden; margin:10px 0 4px;}
  .progressBar{height:100%; background:linear-gradient(90deg,var(--rose-primary),var(--rose-accent)); width:0%;}
  .scoreGrid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:16px 0;}
  .scoreBox{background:var(--rose-lighter); border-radius:14px; padding:14px; text-align:center;}
  .scoreBox .num{font-size:26px; font-weight:800; color:var(--rose-primary-dark);}
  .scoreBox .lbl{font-size:12px; color:#9f1239; margin-top:2px;}
  .totalBox{background:linear-gradient(135deg,var(--rose-primary),var(--rose-accent)); color:#fff; border-radius:14px; padding:16px; text-align:center; margin:10px 0;}
  .totalBox .num{font-size:34px; font-weight:800;}
  .totalBox .lbl{font-size:13px; opacity:.9;}
  .noteBox{background:#fff7ed; border:1.5px solid #fdba74; border-radius:12px; padding:10px 14px; font-size:13px; color:#9a3412; margin:10px 0;}
  .vietP2Review{background:var(--rose-lighter); border-radius:10px; padding:10px 14px; margin-bottom:10px; font-size:14px; white-space:pre-wrap;}
  #reviewList{background:#fffafa; border-radius:14px; padding:6px 12px;}
  .reviewSectionTitle{font-weight:800; color:var(--rose-primary-dark); font-size:15px; margin:22px 0 4px; padding-bottom:6px;}
  .reviewSectionTitle:first-child{margin-top:6px;}
  .reviewItem{padding:16px 2px; margin-bottom:0; font-size:14px; background:transparent; border:none; border-top:1px dashed var(--rose-light); border-radius:0; box-shadow:none;}
  .reviewSectionTitle + .reviewItem{border-top:none;}
  .reviewItem .rHead{display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; font-weight:700; color:#111827; margin-bottom:8px; font-size:14.5px;}
  .reviewItem .rAns{font-size:13px; margin-top:6px; color:#111827;}
  .reviewItem .rExplain{margin-top:10px; background:var(--rose-lighter); border-left:3px solid var(--rose-primary); padding:10px 12px; border-radius:8px; font-size:13px; color:var(--rose-text); line-height:1.5;}
  .reviewToggleBtn{margin-top:14px;}
  .rPrompt{font-size:14.5px; font-weight:700; margin-bottom:8px; color:#111827;}
  .rOptions{margin:6px 0 2px; display:flex; flex-direction:column; align-items:flex-start; gap:6px;}
  .rOptionRow{padding:8px 12px; border-radius:9px; font-size:13.5px; background:#fff; border:1.5px solid #e2e8f0; display:inline-flex; align-items:center; gap:8px; line-height:1.4; color:#111827; max-width:100%;}
  .rOptionRow.isCorrect{border-color:var(--green); background:#fff; font-weight:700; color:var(--green);}
  .rOptionRow.isChosen{border-color:var(--red); background:#fff; color:var(--red);}
  .badgeOk{background:var(--green); color:#fff; font-weight:800; font-size:12px; width:20px; height:20px; line-height:20px; text-align:center; border-radius:999px; display:inline-block; flex-shrink:0;}
  .badgeBad{background:var(--red); color:#fff; font-weight:800; font-size:12px; width:20px; height:20px; line-height:20px; text-align:center; border-radius:999px; display:inline-block; flex-shrink:0;}
  /* Khung o vuong phan Viet - mo phong to giay thi that, moi chu hoc sinh go
     se tu dien vao dung 1 o, co moc danh dau 100/200/300 o cuoi hang tuong
     ung, giup hoc sinh uoc luong dang viet dai/ngan bao nhieu so voi yeu cau. */
  .writeInput{margin-bottom:10px;}
  .gridWrap{
    border:1.5px solid var(--rose-light); border-radius:10px; overflow:hidden;
    background:#fff; cursor:text; margin-bottom:4px;
  }
  .gridRow{display:flex; position:relative;}
  .gridRow:not(:last-child){border-bottom:1px solid var(--rose-light);}
  .gridCell{
    flex:1 1 0; aspect-ratio:1/1; min-width:0; border-right:1px solid var(--rose-light);
    display:flex; align-items:center; justify-content:center;
    font-size:13px; color:#1e293b; font-weight:600; overflow:hidden;
  }
  .gridCell:last-child{border-right:none;}
  .gridMilestone{
    position:absolute; right:2px; bottom:1px; font-size:9px; color:var(--rose-accent); font-weight:700;
  }
  @media(max-width:520px){
    .scoreGrid{grid-template-columns:1fr;}
    .examHead{flex-direction:column; align-items:flex-start;}
    .gridCell{font-size:10px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="logo">TIẾNG TRUNG THẢO NGUYÊN</div>
    <div class="sub">Luyện tập và thi HSK5 3.0</div>
  </div>

  <div id="setupScreen" class="card">
    <h2 class="cardTitle">Thông tin học sinh</h2>
    <label>Họ và tên</label>
    <input type="text" id="inHoTen" placeholder="Nhập họ và tên">
    <label>Mã lớp</label>
    <input type="text" id="inMaLop" placeholder="Nhập mã lớp">
    <label>Chọn bài thi</label>
    <select id="inLesson"><option value="">-- Đang tải danh sách bài --</option></select>

    </div>

    <div class="pageFooter">
      <div class="pfName">TIẾNG TRUNG THẢO NGUYÊN</div>
      <div class="pfSub">Luyện tập và thi HSK5 3.0</div>
      <div class="pfPhone">SĐT: 0911.715.999</div>
    </div>
  </div>

  <div id="examScreen">
    <div class="examHead">
      <div class="who">Học sinh: <b id="showHoTen"></b> &nbsp;|&nbsp; Lớp: <b id="showMaLop"></b> &nbsp;|&nbsp; Bài: <b id="showLesson"></b></div>
      <div class="timer" id="timer">00:00</div>
    </div>
    <div class="progressWrap"><div class="progressBar" id="progressBar"></div></div>
    <div id="sections"></div>

      <button class="btn" id="btnSubmit">Nộp bài</button>
    </div>
  </div>
</div>

<div id="resultOverlay">
  <div class="card" id="resultCard"></div>
</div>

<audio id="playerNghe1" style="display:none"></audio>

<script>
// ================== CAU HINH ==================
// CHU Y: day la placeholder - sau khi deploy Apps Script cua HSK5 xong, thay
// link ben duoi bang link that dang "https://script.google.com/macros/s/.../exec".
var API_URL = 'https://script.google.com/macros/s/AKfycbxUYxNSVqTaNpG-2bcQjWSucogps9801fVGBskwt98JnSYrn_euFxzji--_md3VtIMnEg/exec';
var PENALTY_PER_REPLAY = 10; // tru diem Nghe (thang 100) neu bam nghe lai (chi 1 lan cho CA bai Nghe)
var GRID_COLS = 20; // so o vuong moi hang trong khung viet - dung theo to giay thi that

// ================== STATE ==================
var EXAM = null;
var STUDENT = { hoTen:'', maLop:'', lesson:null };
var ANSWERS = {};       // qid (= STT thuc te, 1~70) -> 'A'/'B'/'C'/'D'/'E'
var WRITE_VALUES = {};  // fieldId (vd 'vietP1_71') -> noi dung hoc sinh go trong khung Viet
var REPLAYED_SET = {};    // audioId -> true (audio Nghe DUY NHAT cua ca bai, chi duoc nghe lai 1 lan)
var REPLAYED_LABELS = []; // ten cac phan da bi bam nghe lai (de ghi vao KetQua)
var AUDIO_LABEL_MAP = {}; // audioId -> nhan (label) cua audio do
var TOTAL_QUESTIONS = 0;
var ANSWERED_SET = {};
var TIMER_SECS = 0;
var TIMER_HANDLE = null;
var LAST_RESULT = null; // luu ket qua sau khi nop bai, dung cho man hinh "Xem lai bai lam"

// ================== TIEN ICH ==================
function qs(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }

function fetchJSON(url){
  return fetch(url).then(function(r){ return r.json(); });
}
function postJSON(url, body){
  return fetch(url, { method:'POST', body: JSON.stringify(body) }).then(function(r){ return r.json(); });
}

function markAnswered(qid){
  if(!ANSWERED_SET[qid]){ ANSWERED_SET[qid] = true; updateProgress(); }
}
function updateProgress(){
  var done = Object.keys(ANSWERED_SET).length;
  var pct = TOTAL_QUESTIONS ? Math.round(done/TOTAL_QUESTIONS*100) : 0;
  qs('progressBar').style.width = pct + '%';
}

function bubbleRow(qid, options, kind){
  // options: mang chu cai (kieu 'letter', vd Doc-p2 sap xep doan van) hoac
  // object {chu_cai: noi_dung} (kieu 'text', vd Nghe/Doc-p1/Doc-p3).
  var letters, getText;
  if(Array.isArray(options)){ letters = options; getText = function(l){ return l; }; }
  else { letters = Object.keys(options).filter(function(l){ return options[l]; }); getText = function(l){ return options[l]; }; }
  var html = '<div class="bubbles" data-qid="'+qid+'">';
  letters.forEach(function(L){
    var label = kind==='letter' ? L : (L+'. '+esc(getText(L)));
    html += '<div class="bubble" data-letter="'+L+'" onclick="pickAnswer(\''+qid+'\',\''+L+'\',this)">'+label+'</div>';
  });
  html += '</div>';
  return html;
}

function pickAnswer(qid, letter, el){
  ANSWERS[qid] = letter;
  var parent = el.parentElement;
  Array.prototype.forEach.call(parent.children, function(c){ c.classList.remove('selected'); });
  el.classList.add('selected');
  markAnswered(qid);
}

var audioSeq = 0;
function audioBarHtml(src, label){
  audioSeq++;
  var id = 'aud'+audioSeq;
  AUDIO_LABEL_MAP[id] = label;
  if(!src){
    return '<div class="audioBar"><div class="label">🔇 '+label+' (chưa có link audio)</div></div>';
  }
  return '<div class="audioBar" id="bar_'+id+'" onclick="onAudioBarClick(event,\''+id+'\')">'+
    '<div style="flex:1">'+
      '<div class="label">🔊 '+label+'</div>'+
      '<div class="sub" id="hint_'+id+'">Bấm để nghe (chỉ được nghe lại đúng 1 lần, nghe lại sẽ bị trừ '+PENALTY_PER_REPLAY+' điểm phần Nghe)</div>'+
    '</div>'+
    '<audio class="audioTrack" id="'+id+'" src="'+src+'" preload="none"></audio>'+
    '<button class="btn" onclick="event.stopPropagation(); startAudio(\''+id+'\')" id="playBtn_'+id+'">▶ Nghe</button>'+
    '<button class="btn secondary replayBtn" style="display:none" onclick="event.stopPropagation(); replayAudio(\''+id+'\')" id="replayBtn_'+id+'">🔁 Nghe lại (-'+PENALTY_PER_REPLAY+' điểm)</button>'+
  '</div>';
}

function toggleAudioBar(id, force){
  var bar = qs('bar_'+id);
  if(!bar) return;
  if(force===true) bar.classList.add('collapsed');
  else if(force===false) bar.classList.remove('collapsed');
  else bar.classList.toggle('collapsed');
}
function onAudioBarClick(ev, id){
  if(ev.target && ev.target.tagName==='BUTTON') return;
  toggleAudioBar(id);
}
function startAudio(id){
  var el = qs(id);
  if(!el) return;
  el.currentTime = 0;
  el.play();
  qs('playBtn_'+id).style.display='none';
  var rb = qs('replayBtn_'+id);
  if(rb && !REPLAYED_SET[id]) rb.style.display='inline-block';
  toggleAudioBar(id, true);
}
function replayAudio(id){
  var el = qs(id);
  if(!el || REPLAYED_SET[id]) return;
  REPLAYED_SET[id] = true;
  REPLAYED_LABELS.push(AUDIO_LABEL_MAP[id] || id);
  el.currentTime = 0;
  el.play();
  toggleAudioBar(id, true);
  var rb = qs('replayBtn_'+id);
  if(rb){ rb.style.display = 'none'; rb.disabled = true; }
}

// ================== KHUNG O VUONG PHAN VIET ==================
// Dung dung so o nhu to giay thi that: cau 71 (Viet P1) = 200 o (20 cot x 10
// hang, moc 100/200), cau 72 (Viet P2) = 300 o (20 cot x 15 hang, moc
// 100/200/300). Hoc sinh go vao 1 textarea binh thuong (de go tieng Trung
// bang IME tren dien thoai/may tinh muot ma), khung o vuong ben duoi chi la
// PHAN HIEN THI THAM KHAO, tu dong cap nhat tung chu vao dung o khi go.
function writeGridHtml(fieldId, totalBoxes, minChars){
  totalBoxes = totalBoxes || 200; minChars = minChars || 100;
  var rows = Math.ceil(totalBoxes / GRID_COLS);
  var cellsHtml = '';
  for(var r=1; r<=rows; r++){
    cellsHtml += '<div class="gridRow">';
    for(var c=1; c<=GRID_COLS; c++){ cellsHtml += '<span class="gridCell"></span>'; }
    var milestone = r*GRID_COLS;
    if(milestone % 100 === 0){ cellsHtml += '<span class="gridMilestone">'+milestone+'</span>'; }
    cellsHtml += '</div>';
  }
  var html = '<textarea class="writeInput" id="ta_'+fieldId+'" placeholder="Viết bài của bạn ở đây..." oninput="onWriteInput(\''+fieldId+'\', this.value, '+totalBoxes+', '+minChars+')"></textarea>';
  html += '<div class="gridWrap" id="grid_'+fieldId+'" onclick="qs(\'ta_'+fieldId+'\').focus()">' + cellsHtml + '</div>';
  html += '<div class="tbdNote" id="count_'+fieldId+'">0 chữ (tối thiểu '+minChars+' chữ, khung giấy có '+totalBoxes+' ô)</div>';
  return html;
}
function onWriteInput(fieldId, val, totalBoxes, minChars){
  var chars = Array.from(String(val||'').replace(/\n/g,''));
  var cells = document.querySelectorAll('#grid_'+fieldId+' .gridCell');
  cells.forEach(function(cell, i){ cell.textContent = i < chars.length ? chars[i] : ''; });
  var nonWs = String(val||'').replace(/\s/g,'').length;
  var el = qs('count_'+fieldId);
  if(el){
    var over = chars.length > totalBoxes;
    el.textContent = nonWs + ' chữ (tối thiểu ' + minChars + ' chữ)' + (nonWs>=minChars?' ✅':'') + (over?' — đã vượt khung giấy, vẫn được tính':'');
  }
  WRITE_VALUES[fieldId] = val;
  markAnswered(fieldId);
}

// ================== TAI DANH SACH BAI ==================
window.addEventListener('DOMContentLoaded', function(){
  fetchJSON(API_URL + '?action=lessons').then(function(res){
    var sel = qs('inLesson');
    if(!res.ok){ sel.innerHTML = '<option value="">Lỗi tải danh sách bài</option>'; return; }
    if(!res.data || !res.data.length){ sel.innerHTML = '<option value="">Chưa có bài nào</option>'; return; }
    sel.innerHTML = '<option value="">-- Chọn bài --</option>' + res.data.map(function(l){
      return '<option value="'+l+'">Bài '+l+'</option>';
    }).join('');
    checkSetupReady();
  }).catch(function(err){
    qs('inLesson').innerHTML = '<option value="">Không kết nối được hệ thống</option>';
    qs('setupErr').textContent = 'Lỗi tải dữ liệu: ' + err;
  });

  ['inHoTen','inMaLop','inLesson'].forEach(function(id){
    qs(id).addEventListener('input', checkSetupReady);
    qs(id).addEventListener('change', checkSetupReady);
  });
  qs('btnStart').addEventListener('click', startExam);
  qs('btnSubmit').addEventListener('click', submitExam);
});

function checkSetupReady(){
  var ok = qs('inHoTen').value.trim() && qs('inMaLop').value.trim() && qs('inLesson').value;
  qs('btnStart').disabled = !ok;
}

// ================== BAT DAU LAM BAI ==================
function startExam(){
  STUDENT.hoTen = qs('inHoTen').value.trim();
  STUDENT.maLop = qs('inMaLop').value.trim();
  STUDENT.lesson = qs('inLesson').value;
  qs('setupErr').textContent = '';
  qs('btnStart').disabled = true;
  qs('btnStart').textContent = 'Đang kiểm tra...';

  // Truoc khi vao de: kiem tra hoc sinh nay da duoc giao vien duyet chua.
  // Lan dau nhap ten -> he thong tu ghi ten vao danh sach cho duyet (tab
  // "HocSinh" trong Google Sheet), hoc sinh phai cho co duyet roi quay lai
  // bam "Bat dau lam bai" lan nua; nhung lan sau (da duoc duyet) vao thang.
  postJSON(API_URL, { action:'checkApproved', hoTen: STUDENT.hoTen }).then(function(chk){
    if(!chk.ok){ throw new Error(chk.error || 'Không kiểm tra được trạng thái duyệt'); }
    if(!chk.approved){
      qs('setupErr').textContent = chk.status === 'new'
        ? 'Tên của bạn đã được gửi tới cô giáo. Vui lòng chờ cô duyệt rồi quay lại bấm "Bắt đầu làm bài".'
        : 'Bạn chưa được cô giáo duyệt. Vui lòng chờ duyệt rồi quay lại bấm "Bắt đầu làm bài".';
      qs('btnStart').disabled = false;
      qs('btnStart').textContent = 'Bắt đầu làm bài';
      return null;
    }
    qs('btnStart').textContent = 'Đang tải đề...';
    return fetchJSON(API_URL + '?action=exam&bai=' + encodeURIComponent(STUDENT.lesson));
  }).then(function(res){
    if(res === null) return;
    if(!res.ok){ throw new Error(res.error || 'Không tải được đề'); }
    EXAM = res.data;
    document.body.classList.add('examMode');
    qs('setupScreen').style.display = 'none';
    qs('examScreen').style.display = 'block';
    qs('showHoTen').textContent = STUDENT.hoTen;
    qs('showMaLop').textContent = STUDENT.maLop;
    qs('showLesson').textContent = STUDENT.lesson;
    renderExam();
    startTimer();
  }).catch(function(err){
    qs('setupErr').textContent = 'Lỗi: ' + err.message;
    qs('btnStart').disabled = false;
    qs('btnStart').textContent = 'Bắt đầu làm bài';
  });
}

function startTimer(){
  TIMER_SECS = 0;
  TIMER_HANDLE = setInterval(function(){
    TIMER_SECS++;
    var m = Math.floor(TIMER_SECS/60), s = TIMER_SECS%60;
    qs('timer').textContent = (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
  }, 1000);
}

// ================== RENDER DE THI ==================
function renderExam(){
  TOTAL_QUESTIONS = countQuestions();
  var html = '';

  html += '<div class="sectionTitle">🎧 Phần Nghe (35 câu)</div>';
  html += '<div class="card">' + renderNghe() + '</div>';

  html += '<div class="sectionTitle">📖 Phần Đọc (35 câu)</div>';
  html += '<div class="card">' + renderDocP1(EXAM.doc_p1) + '</div>';
  html += '<div class="card">' + renderDocP2(EXAM.doc_p2) + '</div>';
  html += '<div class="card">' + renderDocP3(EXAM.doc_p3) + '</div>';

  html += '<div class="sectionTitle">✍️ Phần Viết (2 câu)</div>';
  html += '<div class="card">' + renderVietP1(EXAM.viet_p1) + '</div>';
  html += '<div class="card">' + renderVietP2(EXAM.viet_p2) + '</div>';

  qs('sections').innerHTML = html;
}

var PART_LABELS_ = {
  nghe_p1: { zh: '听录音，选择正确答案', vi: 'Nghe đoạn hội thoại/văn bản ngắn, chọn đáp án đúng.' },
  nghe_p2: { zh: '听录音，选择正确答案', vi: 'Nghe đoạn hội thoại/văn bản dài hơn, chọn đáp án đúng.' },
  doc_p1:  { zh: '选词填空', vi: 'Đọc đoạn văn, chọn từ phù hợp điền vào mỗi chỗ trống đánh số.' },
  doc_p2:  { zh: '排列顺序', vi: 'Sắp xếp 5 đoạn văn (A-E) cho sẵn vào đúng thứ tự của bài.' },
  doc_p3:  { zh: '阅读短文，选择正确答案', vi: 'Đọc bài văn, trả lời các câu hỏi trắc nghiệm.' },
  viet_p1: { zh: '看图写作', vi: 'Xem 4 bức tranh, viết 1 bài kể chuyện không dưới 100 chữ. Giáo viên sẽ chấm trực tiếp, không chấm tự động.' },
  viet_p2: { zh: '话题作文', vi: 'Viết 1 bài luận theo chủ đề/đề bài cho sẵn, không dưới 200 chữ. Giáo viên sẽ chấm trực tiếp, không chấm tự động.' }
};
function rangeLabel_(items){
  if(!items || !items.length) return '';
  var first = items[0].id, last = items[items.length-1].id;
  return first===last ? String(first) : (first+'~'+last);
}
function groupHeadHtml_(items){
  var range = rangeLabel_(items);
  return range ? '<div class="groupHead">第'+esc(range)+'题</div>' : '';
}
function partHeadHtml_(key, items, partLabel){
  var lab = PART_LABELS_[key] || { zh:'', vi:'' };
  var range = rangeLabel_(items);
  var zh = (range ? ('第'+range+'题：') : '') + lab.zh;
  var labelHtml = partLabel ? '<div class="partLabel">'+esc(partLabel)+'</div>' : '';
  return '<div class="partHead">'+labelHtml+'<div class="zh">'+esc(zh)+'</div><div class="desc">'+esc(lab.vi)+'</div></div>';
}

function countQuestions(){
  var n = 0;
  ['nghe_p1','nghe_p2','doc_p1','doc_p2','doc_p3','viet_p1','viet_p2'].forEach(function(k){
    if(EXAM[k] && EXAM[k].items) n += EXAM[k].items.length;
  });
  return n;
}

// Nghe_P1 (cau 1-19) + Nghe_P2 (cau 20-35): dung CHUNG 1 audio DUY NHAT cho
// ca phan Nghe cua 1 Bai - chi hien 1 audioBar o dau phan. Moi cau doc lap,
// 4 dap an chu rieng (khong pool/anh dung chung).
function renderNghe(){
  var h = '';
  h += audioBarHtml(EXAM.nghe_p1.linkAudio || EXAM.nghe_p2.linkAudio, 'Audio phần Nghe (toàn bộ 35 câu)');
  h += partHeadHtml_('nghe_p1', EXAM.nghe_p1.items, '第一部分');
  (EXAM.nghe_p1.items||[]).forEach(function(it){
    h += '<div class="qBlock"><div class="qRow"><span class="qNum">'+it.id+'.</span></div><div class="qRow">' + bubbleRow(it.id, it.options||{}, 'text') + '</div></div>';
  });
  h += partHeadHtml_('nghe_p2', EXAM.nghe_p2.items, '第二部分');
  (EXAM.nghe_p2.items||[]).forEach(function(it){
    h += '<div class="qBlock"><div class="qRow"><span class="qNum">'+it.id+'.</span></div><div class="qRow">' + bubbleRow(it.id, it.options||{}, 'text') + '</div></div>';
  });
  return h;
}

// ================== CHAM DIEM & NOP BAI ==================
// Chi Nghe + Doc duoc tu cham (thang 100/moi ky nang, 35 cau/ky nang). Viet
// (P1 + P2) KHONG tu cham - luu nguyen bai lam de giao vien doc va dien diem
// tay vao KetQua.
function computeScore(){
  var ngheTotal = (EXAM.nghe_p1.items.length + EXAM.nghe_p2.items.length) || 1;
  var docTotal = (EXAM.doc_p1.items.length + EXAM.doc_p2.items.length + EXAM.doc_p3.items.length) || 1;

  var ngheCorrect = 0, docCorrect = 0;
  var detail = {};

  [EXAM.nghe_p1, EXAM.nghe_p2].forEach(function(part){
    part.items.forEach(function(it){
      var chosen = ANSWERS[it.id] || '';
      var ok = it.answer && chosen === it.answer;
      if(ok) ngheCorrect++;
      detail[it.id] = { chosen: chosen, answer: it.answer, ok: ok, skill:'nghe' };
    });
  });
  [EXAM.doc_p1, EXAM.doc_p2, EXAM.doc_p3].forEach(function(part){
    part.items.forEach(function(it){
      var chosen = ANSWERS[it.id] || '';
      var ok = it.answer && chosen === it.answer;
      if(ok) docCorrect++;
      detail[it.id] = { chosen: chosen, answer: it.answer, ok: ok, skill:'doc' };
    });
  });

  var ngheRaw = Math.round(ngheCorrect/ngheTotal*100);
  var ngheScore = Math.max(0, ngheRaw - REPLAYED_LABELS.length*PENALTY_PER_REPLAY);
  var docScore = Math.round(docCorrect/docTotal*100);

  var vietP1 = EXAM.viet_p1.items.map(function(it){
    return { id: it.id, goiY: it.goiY, text: (WRITE_VALUES['vietP1_'+it.id]||'').trim() };
  });
  var vietP2 = EXAM.viet_p2.items.map(function(it){
    return { id: it.id, deBai: it.deBai, text: (WRITE_VALUES['vietP2_'+it.id]||'').trim() };
  });

  return {
    ngheScore: ngheScore, docScore: docScore, detail: detail,
    vietP1: vietP1, vietP2: vietP2,
    replayedParts: REPLAYED_LABELS.slice()
  };
}

function submitExam(){
  if(TIMER_HANDLE) clearInterval(TIMER_HANDLE);
  var result = computeScore();
  qs('btnSubmit').disabled = true;
  qs('btnSubmit').textContent = 'Đang nộp bài...';

  var vietP1Text = result.vietP1.map(function(v){ return 'Câu '+v.id+': '+(v.text||'(bỏ trống)'); }).join('\n');
  var vietP2Text = result.vietP2.map(function(v){ return 'Câu '+v.id+': '+(v.text||'(bỏ trống)'); }).join('\n');

  var payload = {
    hoTen: STUDENT.hoTen, maLop: STUDENT.maLop, baiSo: STUDENT.lesson,
    diemNghe: result.ngheScore, diemDoc: result.docScore,
    tongDiem: result.ngheScore + result.docScore,
    replayedParts: result.replayedParts, detail: result.detail,
    vietP1Text: vietP1Text, vietP2Text: vietP2Text
  };

  fetch(API_URL, { method:'POST', body: JSON.stringify({ action:'submit', payload: payload }) })
    .then(function(r){ return r.json(); })
    .then(function(res){
      if(!res || !res.ok){
        console.error('Nộp bài thất bại phía máy chủ:', res && res.error);
        result.submitFailed = true;
      }
    })
    .catch(function(err){
      console.error('Loi nop bai', err);
      result.submitFailed = true;
    })
    .then(function(){ showResult(result); });
}

function showResult(result){
  markAllAnswers(result);
  var html = '<h2 class="cardTitle">🎉 Đã nộp bài</h2>';
  if(result.submitFailed){
    html += '<div class="errMsg" style="background:#fee2e2; border:1.5px solid var(--red); border-radius:10px; padding:10px 14px; margin-bottom:12px;">⚠️ Chưa lưu được kết quả vào hệ thống (lỗi kết nối/máy chủ). Vui lòng chụp lại màn hình điểm này và báo cho giáo viên.</div>';
  }
  html += '<div class="scoreGrid">';
  html += '<div class="scoreBox"><div class="num">'+result.ngheScore+'</div><div class="lbl">Điểm Nghe (/100)</div></div>';
  html += '<div class="scoreBox"><div class="num">'+result.docScore+'</div><div class="lbl">Điểm Đọc (/100)</div></div>';
  html += '</div>';
  html += '<div class="totalBox"><div class="num">'+(result.ngheScore+result.docScore)+' / 200</div><div class="lbl">Tổng điểm Nghe + Đọc</div></div>';
  html += '<div class="noteBox">📝 Phần Viết (Viết P1 + Viết P2) đã được lưu lại đầy đủ vào hệ thống. Giáo viên sẽ đọc và chấm điểm tay, điểm tổng cả bài (Nghe + Đọc + Viết) sẽ được cập nhật sau trong bảng điểm.' +
    (result.replayedParts.length ? '<br>🔁 Đã bấm nghe lại: ' + esc(result.replayedParts.join(', ')) + ' (bị trừ '+PENALTY_PER_REPLAY+' điểm phần Nghe).' : '') +
    '</div>';

  html += '<h2 class="cardTitle" style="margin-top:20px">Bài viết của bạn</h2>';
  html += '<div class="reviewSectionTitle">Viết – Phần 1 (xem tranh viết văn)</div>';
  result.vietP1.forEach(function(v){
    html += '<div class="vietP2Review"><b>Câu '+v.id+'</b> (gợi ý: '+esc(v.goiY||'')+')<br>' + (v.text ? esc(v.text) : '<i>(chưa viết)</i>') + '</div>';
  });
  html += '<div class="reviewSectionTitle">Viết – Phần 2 (viết theo chủ đề)</div>';
  result.vietP2.forEach(function(v){
    html += '<div class="vietP2Review"><b>Câu '+v.id+'</b><br>' + (v.text ? esc(v.text) : '<i>(chưa viết)</i>') + '</div>';
  });

  html += '<div class="btnRow reviewToggleBtn"><button class="btn secondary" id="btnToggleReview" onclick="toggleReview()">📋 Xem lại bài làm và đáp án (Nghe + Đọc)</button></div>';
  html += '<div id="reviewList" style="display:none"></div>';
  html += '<div class="btnRow"><button class="btn" onclick="location.reload()">Làm bài khác</button></div>';
  qs('resultCard').innerHTML = html;
  qs('resultOverlay').style.display = 'block';
  LAST_RESULT = result;
}

function toggleReview(){
  var box = qs('reviewList');
  var btn = qs('btnToggleReview');
  var showing = box.style.display !== 'none';
  if(showing){
    box.style.display = 'none';
    btn.textContent = '📋 Xem lại bài làm và đáp án';
  } else {
    if(!box.dataset.filled){ box.innerHTML = buildReviewHtml(LAST_RESULT); box.dataset.filled = '1'; }
    box.style.display = 'block';
    btn.textContent = '🔼 Ẩn bài làm và đáp án';
  }
}

function reviewItemHtml(no, ok, bodyHtml, giaiThich){
  var cls = ok ? 'ok' : 'bad';
  var icon = ok ? '✅' : '❌';
  var html = '<div class="reviewItem '+cls+'">';
  html += '<div class="rHead"><span>'+icon+' Câu '+no+'</span></div>';
  html += bodyHtml;
  if(!ok && giaiThich) html += '<div class="rExplain">💡 Giải thích: '+esc(giaiThich)+'</div>';
  html += '</div>';
  return html;
}

function optionsReviewHtml(options, chosen, correct, kind){
  var letters, getText;
  if(Array.isArray(options)){ letters = options; getText = function(l){ return l; }; }
  else { letters = Object.keys(options||{}).filter(function(l){ return options[l]; }); getText = function(l){ return options[l]; }; }
  var html = '<div class="rOptions">';
  letters.forEach(function(L){
    var cls = 'rOptionRow';
    var badge = '';
    if(L===correct){ cls += ' isCorrect'; badge = ' <span class="badgeOk">✓</span>'; }
    else if(L===chosen){ cls += ' isChosen'; badge = ' <span class="badgeBad">✗</span>'; }
    var label = kind==='letter' ? L : (L+'. '+esc(getText(L)));
    html += '<div class="'+cls+'">'+label+badge+'</div>';
  });
  if(!chosen) html += '<div class="rAns">(Bạn chưa chọn đáp án)</div>';
  html += '</div>';
  return html;
}

function buildReviewHtml(result){
  var h = '';

  h += '<div class="reviewSectionTitle">Nghe – Phần 1</div>';
  EXAM.nghe_p1.items.forEach(function(it){
    var chosen = ANSWERS[it.id] || '';
    var ok = !!(it.answer && chosen === it.answer);
    h += reviewItemHtml(it.id, ok, optionsReviewHtml(it.options, chosen, it.answer, 'text'), it.giaiThich);
  });

  h += '<div class="reviewSectionTitle">Nghe – Phần 2</div>';
  EXAM.nghe_p2.items.forEach(function(it){
    var chosen = ANSWERS[it.id] || '';
    var ok = !!(it.answer && chosen === it.answer);
    h += reviewItemHtml(it.id, ok, optionsReviewHtml(it.options, chosen, it.answer, 'text'), it.giaiThich);
  });

  h += '<div class="reviewSectionTitle">Đọc – Phần 1 (điền từ)</div>';
  (EXAM.doc_p1.groups||[]).forEach(function(g){
    h += groupHeadHtml_(g.items);
    var passageHtml = g.passage ? '<div class="passageBox">'+esc(g.passage)+'</div>' : '';
    (g.items||[]).forEach(function(it, idx){
      var chosen = ANSWERS[it.id] || '';
      var ok = !!(it.answer && chosen === it.answer);
      var body = (idx===0 ? passageHtml : '') + '<div class="rPrompt">Chỗ trống ('+it.id+')</div>';
      body += optionsReviewHtml(it.options, chosen, it.answer, 'text');
      h += reviewItemHtml(it.id, ok, body, it.giaiThich);
    });
  });

  h += '<div class="reviewSectionTitle">Đọc – Phần 2 (sắp xếp đoạn văn)</div>';
  (EXAM.doc_p2.groups||[]).forEach(function(g){
    h += groupHeadHtml_(g.items);
    var letters = Object.keys(g.pool||{}).filter(function(l){ return g.pool[l]; });
    var poolHtml = '<div class="passagePool">' + letters.map(function(L){
      return '<div class="passagePoolItem"><b>'+L+'.</b> '+esc(g.pool[L])+'</div>';
    }).join('') + '</div>';
    (g.items||[]).forEach(function(it, idx){
      var chosen = ANSWERS[it.id] || '';
      var ok = !!(it.answer && chosen === it.answer);
      var body = (idx===0 ? poolHtml : '') + '<div class="rPrompt">Vị trí thứ '+(idx+1)+'</div>';
      body += optionsReviewHtml(letters, chosen, it.answer, 'letter');
      h += reviewItemHtml(it.id, ok, body, it.giaiThich);
    });
  });

  h += '<div class="reviewSectionTitle">Đọc – Phần 3 (đọc hiểu)</div>';
  (EXAM.doc_p3.groups||[]).forEach(function(g){
    h += groupHeadHtml_(g.items);
    var imgHtml = g.image ? '<div class="imgPool"><div class="imgPoolItem"><img src="'+g.image+'"></div></div>' : '';
    var passageHtml = g.passage ? '<div class="passageBox">'+esc(g.passage)+'</div>' : '';
    (g.items||[]).forEach(function(it, idx){
      var chosen = ANSWERS[it.id] || '';
      var ok = !!(it.answer && chosen === it.answer);
      var body = (idx===0 ? (imgHtml+passageHtml) : '') + (it.question ? '<div class="rPrompt">'+esc(it.question)+'</div>' : '');
      body += optionsReviewHtml(it.options, chosen, it.answer, 'text');
      h += reviewItemHtml(it.id, ok, body, it.giaiThich);
    });
  });

  return h;
}

function markAllAnswers(result){
  Object.keys(result.detail).forEach(function(qid){
    var d = result.detail[qid];
    var group = document.querySelector('.bubbles[data-qid="'+qid+'"]');
    if(!group) return;
    Array.prototype.forEach.call(group.children, function(b){
      var L = b.getAttribute('data-letter');
      if(L === d.answer) b.classList.add('correct');
      else if(L === d.chosen && !d.ok) b.classList.add('wrong');
    });
  });
}
